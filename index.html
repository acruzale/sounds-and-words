<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounds and Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a tab bar for the four areas, one working panel below; tiles sized for a tablet and a child's finger. */
  --ink:#1b2733;
  --paper:#edf3f6;
  --card:#ffffff;
  --line:#d2dee5;
  --muted:#596b78;
  --coral:#f2603f;
  --teal:#157f74;
  --sun:#ffc93c;
  --good:#1d9452;
  --warn:#d98a00;
  --bad:#cf3e36;
  --set1:#e3f4f0;
  --set2:#fff1cc;
  --set3:#fde4dd;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --phonics:"Andika","Century Gothic","Comic Sans MS",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--phonics);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}

/* top bar */
header.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.topin{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:600;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:500;opacity:.7;font-size:.85rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:2px solid transparent;color:#fff;padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:1rem}
nav.tabs button[aria-current="page"]{background:var(--sun);color:var(--ink)}
.authbtn{border:2px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:500}
.authbtn.in{background:var(--teal);border-color:var(--teal)}
.modebar{background:var(--sun);color:var(--ink)}
.modebar:empty{display:none}
.modebar .in{max-width:1080px;margin:0 auto;padding:7px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.95rem}
.modebar button{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:5px 14px;font-family:var(--display);font-weight:500}
nav.tabs button:not([aria-current="page"]):hover{border-color:rgba(255,255,255,.35)}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0 12px}
.pagehead h1{font-size:1.8rem}
.pagehead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-family:var(--display);font-weight:500}
.seg button.on{background:var(--teal);color:#fff}

.note{background:var(--card);border-left:5px solid var(--sun);border-radius:10px;padding:10px 14px;margin:6px 0 16px;color:var(--ink);font-size:.95rem}
.note b{font-family:var(--display);font-weight:600}

.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--teal);color:#fff;font-family:var(--display);font-weight:500;font-size:1rem;display:inline-flex;align-items:center;gap:6px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.coral{background:var(--coral)}
.btn.good{background:var(--good)}
.btn.bad{background:var(--bad)}
.btn.big{font-size:1.2rem;padding:14px 22px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}

/* sound chart */
.setlabel{font-family:var(--display);font-weight:600;margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.setlabel .chip{font-size:.8rem;padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:500}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stile{position:relative;border:2px solid transparent;border-radius:16px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.stile.set1{background:var(--set1)}.stile.set2{background:var(--set2)}.stile.set3{background:var(--set3)}
.stile .g{font-size:2.3rem;line-height:1.1;font-weight:700}
.stile .hint{font-size:.75rem;color:var(--muted);margin-top:-2px}
.stile .pic{font-size:1.5rem;white-space:nowrap}
.stile:hover{border-color:var(--ink)}
.stile .st{position:absolute;top:6px;right:8px;font-size:.8rem;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display)}
.stile.known .st{background:var(--good)}
.stile.practise .st{background:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dotk,.dotp{width:14px;height:14px;border-radius:50%;display:inline-block}
.dotk{background:var(--good)}.dotp{background:var(--warn)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,30,40,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px;position:relative}
.modal .x{position:absolute;top:10px;right:12px;border:0;background:var(--paper);border-radius:50%;width:40px;height:40px;font-size:1.3rem}
.bigg{font-size:5.5rem;font-weight:700;line-height:1;text-align:center;margin:6px 0 4px}
.example{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 14px}
.example .pic{font-size:3.4rem}
.example .w{font-size:2rem;font-weight:700;text-align:center}
.example{flex-wrap:wrap}
.tipbox{background:var(--paper);border-radius:14px;padding:12px 14px;margin:10px 0}
.tipbox h3{font-size:.95rem;margin-bottom:4px;color:var(--teal)}
.tipbox p{margin:0}
.es{color:#7a3d8f}

/* speed sounds */
.flash{background:var(--card);border-radius:26px;padding:26px 18px;text-align:center;margin:10px auto;max-width:640px;box-shadow:0 2px 0 var(--line)}
.flash .bigg{font-size:9rem}
.progressbar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px auto 14px;max-width:640px}
.progressbar i{display:block;height:100%;background:var(--teal);border-radius:999px;transition:width .2s}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
.opts label{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:12px}
.opts input{width:20px;height:20px}
.reslist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.reslist span{font-size:1.8rem;font-weight:700;background:var(--set3);border-radius:12px;padding:2px 14px}

/* blending */
.levels{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.levels button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;text-align:left;font-size:.92rem;line-height:1.25}
.levels button b{display:block;font-family:var(--display);font-weight:600;font-size:1rem}
.levels button.on{border-color:var(--teal);background:#e1f2ef}
.wordstage{background:var(--card);border-radius:26px;padding:28px 18px 22px;text-align:center;box-shadow:0 2px 0 var(--line);max-width:760px;margin:0 auto}
.sbrow{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:wrap;margin:22px 0 10px}
.sb{border:0;background:transparent;padding:4px 6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;min-width:56px}
.sb .g{font-size:4.6rem;font-weight:700;line-height:1}
.sb .dot{width:14px;height:14px;border-radius:50%;background:var(--ink);margin-top:8px}
.sb .dash{width:70%;min-width:36px;height:8px;border-radius:6px;background:var(--ink);margin-top:11px}
.sb.lit{background:var(--sun)}
.split{position:relative;display:inline-flex;align-items:flex-end;gap:4px}
.split::before{content:"";position:absolute;left:26px;right:26px;bottom:-4px;height:30px;border:5px solid var(--coral);border-top:0;border-radius:0 0 40px 40px}
.split .sb.split-part .g{color:var(--coral)}
.reveal{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.reveal .pic{font-size:4.5rem;line-height:1.1}
.reveal .w{font-size:3rem;font-weight:700}
.reveal .es{font-size:1.15rem}
.counter{color:var(--muted);font-size:.9rem;font-family:var(--display)}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}
.slot{min-width:74px;height:84px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-size:2.8rem;font-weight:700;padding:0 8px}
.slot.filled{border-style:solid;border-color:var(--teal);background:#e1f2ef}
.slot.wrong{border-color:var(--bad);background:#fbe3e1}
.slot.right{border-color:var(--good);background:#dff3e7}
.tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.tile{border:0;background:var(--sun);border-radius:14px;min-width:66px;height:70px;font-size:2.2rem;font-weight:700;padding:0 12px;box-shadow:0 3px 0 #d9a522}
.tile:disabled{opacity:.25;box-shadow:none}
.tile.sound{background:#cfe9fb;box-shadow:0 3px 0 #8ec3e6}

/* vocabulary */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.topic{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:130px}
.topic:hover{border-color:var(--teal)}
.topic .ic{font-size:2.2rem}
.topic b{font-family:var(--display);font-weight:600;font-size:1.1rem}
.topic .es{font-size:.9rem}
.topic .meta{margin-top:auto;font-size:.85rem;color:var(--muted)}
.topic.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--teal)}
.topic.custom{background:#f3f0fb}
.topic.nelson{background:#fff6f2}
.topic.nelson .ic{font-family:var(--phonics);font-weight:700;font-size:1.7rem;color:var(--coral)}
.keyw{font-family:var(--display);font-size:.75rem;background:var(--sun);color:var(--ink);border-radius:999px;padding:1px 8px}
.vcard.key{border-color:var(--sun);border-width:3px}
.tricky{font-family:var(--display);font-size:.75rem;background:var(--ink);color:#fff;border-radius:999px;padding:1px 8px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.vcard .pic{font-size:3rem;line-height:1.2}
.vcard .en{font-size:1.35rem;font-weight:700}
.vcard .es{font-size:.95rem}
.vcard .stars{font-size:.85rem;color:var(--warn);min-height:1.2em}
.vcard .row{gap:6px;margin-top:4px}
.mini{border:0;background:var(--paper);border-radius:10px;padding:6px 10px;font-size:.9rem}
.pic.txtpic{font-family:var(--display);font-weight:600;background:var(--set2);border-radius:14px;padding:0 12px;font-size:2rem;min-width:64px;display:inline-grid;place-items:center}
img.pic.imgpic{width:96px;height:96px;object-fit:cover;border-radius:12px}
.pic.nopic{font-size:2rem;opacity:.5}
.qwrap{background:var(--card);border-radius:24px;padding:22px 16px;max-width:760px;margin:0 auto;text-align:center;box-shadow:0 2px 0 var(--line)}
.qprompt{font-size:2.6rem;font-weight:700;margin:6px 0}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.qopt{border:3px solid var(--line);background:var(--paper);border-radius:18px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
.qopt .pic{font-size:3.6rem}
.qopt .lbl{font-size:1.5rem;font-weight:700}
.qopt.right{border-color:var(--good);background:#dff3e7}
.qopt.wrong{border-color:var(--bad);background:#fbe3e1}
.feedback{min-height:2em;font-family:var(--display);font-size:1.3rem;margin-top:12px}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.flashcard{background:var(--card);border-radius:26px;padding:26px 18px;max-width:560px;margin:0 auto;text-align:center;box-shadow:0 2px 0 var(--line)}
.flashcard .pic{font-size:7rem;line-height:1.1}
.flashcard img.pic.imgpic{width:200px;height:200px}
.flashcard .en{font-size:3rem;font-weight:700;min-height:1.3em}
.flashcard .es{font-size:1.3rem;min-height:1.5em}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px;margin:0 auto}
.mcard{border:0;border-radius:16px;min-height:110px;background:var(--teal);color:#fff;font-size:2rem;display:grid;place-items:center;padding:6px}
.mcard.open{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.mcard.done{background:#dff3e7;color:var(--ink);border:3px solid var(--good)}
.mcard .pic{font-size:2.8rem}
.mcard .lbl{font-size:1.35rem;font-weight:700}
.mcard img.pic.imgpic{width:70px;height:70px}

/* forms */
.panel{background:var(--card);border-radius:18px;padding:18px;border:1px solid var(--line);margin-bottom:16px}
.panel h2{font-size:1.25rem;margin-bottom:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.field textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
.wlist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.witem{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:12px;padding:6px 10px}
.witem .pic{font-size:1.8rem}
.witem img.pic.imgpic{width:44px;height:44px}
.witem .pic.txtpic{font-size:1rem;min-width:40px}
.witem .t{flex:1;min-width:0}
.witem .t b{font-size:1.15rem}
.witem .t small{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}

/* progress */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--line)}
.stat .n{font-family:var(--display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--good)}
.trow{display:grid;grid-template-columns:34px 1fr 140px 64px;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow .n{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:.9rem}
.mini-s{display:flex;flex-wrap:wrap;gap:6px}
.mini-s button{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:48px;padding:4px 8px;font-size:1.3rem;font-weight:700}
.mini-s button.known{background:#dff3e7;border-color:var(--good)}
.mini-s button.practise{background:#fff1cc;border-color:var(--warn)}

/* assessment */
.achips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.achips button{border:2px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;padding:3px 8px;font-size:1.05rem;font-weight:700}
.achips button.ok{background:#dff3e7;border-color:var(--good)}
.achips button.no{background:#fbe3e1;border-color:var(--bad)}
.achips button.cur{outline:3px solid var(--ink);outline-offset:1px}
.ascore{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.ascore .grp{display:flex;flex-direction:column;align-items:center;gap:6px}
.ascore .grp span{font-family:var(--display);color:var(--muted)}
.tog{border:3px solid var(--line);background:var(--paper);border-radius:14px;min-width:70px;height:58px;font-size:1.6rem;font-family:var(--display)}
.tog.ok.on{background:var(--good);border-color:var(--good);color:#fff}
.tog.no.on{background:var(--bad);border-color:var(--bad);color:#fff}
.teacher{background:var(--set2);border-radius:12px;padding:6px 12px;display:inline-block;font-size:.95rem;margin-bottom:6px}
.said{max-width:360px;margin:10px auto 0}
.sheet{width:100%;border-collapse:collapse;font-size:.98rem}
.sheet th,.sheet td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.sheet th{background:var(--paper);font-family:var(--display);font-weight:500}
.sheet td.c{text-align:center;font-weight:700;width:80px}
.sheet td.g{font-weight:700;font-size:1.15rem;width:70px}
.yes{color:var(--good)}.nope{color:var(--bad)}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.tablewrap{overflow-x:auto}
.hist{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.hist b{font-family:var(--display);font-weight:600}
.hist .sc{color:var(--muted);font-size:.92rem;flex:1;min-width:200px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-family:var(--display);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.cheer{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cheer{animation:none}.progressbar i{transition:none}}
@media (max-width:560px){
  .sb .g{font-size:3.4rem}.sb{min-width:44px}
  .flash .bigg{font-size:6.5rem}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .trow{grid-template-columns:30px 1fr 70px 50px}
  .qopt .pic{font-size:2.8rem}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">🔤 Sounds and Words <small>English for Spanish speakers</small></div>
    <nav class="tabs" aria-label="Sections">
      <button data-act="route" data-arg="sounds">Sounds</button>
      <button data-act="route" data-arg="blending">Blending</button>
      <button data-act="route" data-arg="vocabulary">Vocabulary</button>
      <button data-act="route" data-arg="assess">Assess</button>
      <button data-act="route" data-arg="progress">Progress</button>
    </nav>
    <button id="authbtn" class="authbtn" data-act="account">🧭 Explore · not saved</button>
  </div>
  <div id="modebar" class="modebar"></div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------------- DATA ---------------- */
const SOUNDS = [
 // Set 1
 {id:'m',g:'m',set:1,word:'mountain',pic:'🏔️',tip:'Same as Spanish m (mamá). Lips closed, hum: mmm.',es:'Igual que la m en español: mmm.'},
 {id:'a',g:'a',set:1,word:'apple',pic:'🍎',tip:'Short a as in "cat". Like Spanish a but shorter and quicker.',es:'Una a corta y rápida.'},
 {id:'s',g:'s',set:1,word:'snake',pic:'🐍',tip:'Same as Spanish s. Hiss like a snake: sss.',es:'Igual que la s: sss.'},
 {id:'d',g:'d',set:1,word:'dinosaur',pic:'🦕',tip:'Tongue tip on the bump behind the top teeth. Spanish d between vowels goes soft (as in "cada"); in English it always stays firm.',es:'Una d fuerte, siempre.'},
 {id:'t',g:'t',set:1,word:'tower',pic:'🗼',tip:'Tongue on the bump behind the top teeth, with a small puff of air. Spanish t has no puff.',es:'Una t con un poquito de aire.'},

function picHTML(p,cls='pic'){

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}}
function pickVoice(lang){
  const prefs = lang==='es' ? ['es-es','es-mx','es-us','es'] : ['en-gb','en-ie','en-au','en-us','en'];
  for(const p of prefs){const v=voices.find(v=>(v.lang||'').replace('_','-').toLowerCase().startsWith(p));if(v)return v;}
  return null;
}
function speak(text,lang='en'){
  if(!('speechSynthesis' in window)){toast('Audio is not available in this browser');return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/…/g,'').replace(/ \+ /g,', '));
    const v=pickVoice(lang); if(v)u.voice=v;
    u.lang = v ? v.lang : (lang==='es'?'es-ES':'en-GB');
    u.rate = state.settings.rate;
    speechSynthesis.speak(u);
  }catch(e){toast('Audio could not play');}
}

function soundButtonsHTML(ts){
  let h='',i=0;
  while(i<ts.length){
    const tk=ts[i];
    if(tk.endsWith('*')){
      h+='<span class="split">'+sbBtn(tk.slice(0,-1),i,'split-part');
      let j=i+1;
      while(j<ts.length && !ts[j].startsWith('*')){h+=sbBtn(ts[j],j);j++;}
      if(j<ts.length) h+=sbBtn(ts[j].slice(1),j,'split-part');
      h+='</span>'; i=j+1;
    } else {h+=sbBtn(tk,i);i++;}
  }
  return h;
}

  ui.speed={deck:ui.speedMix?shuffle(ids):ids.slice(),i:0,res:{},show:false};renderSounds();
}

/* ---------------- BLENDING ---------------- */
function currentLevel(){const L=allLevels();return L.find(l=>l.id===ui.level)||L[0];}
const SET_SIZE=15;
function startBlendSession(){
  const L=currentLevel();let ws=L.words;if(ui.blendMode==='spell')ws=ws.filter(w=>!w[0].includes('*'));
  ui.bs={level:L.id,unit:ui.nelsonUnit,keyOnly:!!ui.keyOnly,levelName:L.id==='nelson'?(ui.nelsonUnit&&ui.nelsonUnit!=='all'?'Nelson 1A Unit '+ui.nelsonUnit:'Nelson 1A, all units'):L.name,mode:ui.blendMode,words:shuffle(ws).slice(0,SET_SIZE),i:0,revealed:false,spell:null,stage:'cards',marks:{},notes:{},overall:'',saved:false};
}
function renderBlending(){
  const levels=allLevels();
  if(!ui.bs||ui.bs.level!==currentLevel().id||ui.bs.mode!==ui.blendMode||(ui.bs.level==='nelson'&&(ui.bs.unit!==ui.nelsonUnit||ui.bs.keyOnly!==!!ui.keyOnly)))startBlendSession();
  const bs=ui.bs;
  let h=`<div class="pagehead"><div><h1>Fred Talk and blending</h1>
   <p>Read: tap each sound button as she says the sound, then blend. Spell: hear the word and build it from sounds. Sets of ${SET_SIZE} words, with a private review at the end.</p></div>
   <div class="seg" role="group" aria-label="Blending activity">
     <button class="${ui.blendMode==='read'?'on':''}" data-act="bmode" data-arg="read">Read words</button>
     <button class="${ui.blendMode==='spell'?'on':''}" data-act="bmode" data-arg="spell">Spell with sounds</button>
   </div></div>
   <div class="levels" role="group" aria-label="Word level">${levels.map(l=>`<button class="${l.id===currentLevel().id?'on':''}" data-act="level" data-arg="${l.id}"><b>${esc(l.name)}</b>${esc(l.sub)}</button>`).join('')}</div>
   ${currentLevel().id==='nelson'?`<div class="row" style="margin-bottom:12px"><label class="field" for="nunit" style="flex-direction:row;align-items:center;gap:8px">Unit <select id="nunit"><option value="all">All units</option>${NELSON.filter(t=>t.words.some(w=>w.snd)).map(t=>`<option value="${t.unit}" ${String(ui.nelsonUnit)===String(t.unit)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label class="row" style="gap:6px"><input type="checkbox" id="keyonly" ${ui.keyOnly?'checked':''}> 🔑 Key words only</label></div>`:''}`;
  if(!bs.words.length){app.innerHTML=h+`<div class="wordstage"><p class="empty">No words for this activity at this level.</p></div>`;return;}
  const n=bs.words.length;
  if(bs.stage==='end'){
    app.innerHTML=h+`<div class="wordstage cheer"><div class="reveal"><span class="pic">🌟</span><h2 style="font-size:2rem">Finished! ¡Terminado!</h2><p style="font-size:1.3rem;margin:0">${n} words. Well done! ¡Muy bien!</p></div>
      <div class="row center" style="margin-top:14px"><button class="btn big" data-act="breview">📝 Teacher review</button><button class="btn big alt" data-act="bnewset">New set of words</button></div>
      ${bs.saved?'<p class="counter">Review saved. You can see it under Progress.</p>':''}</div>`;
    return;
  }
  if(bs.stage==='review'){
    const tog=(i,val)=>{const cur=bs.marks[i];return `<button class="tog ${val?'ok':'no'} ${cur===val?'on':''}" style="min-width:52px;height:44px;font-size:1.2rem" data-act="bmarkw" data-arg="${i}|${val?1:0}" aria-label="${val?'read correctly':'not yet'}">${val?'✓':'✗'}</button>`;};
    app.innerHTML=h+`<div class="panel"><h2>Teacher review: ${esc(bs.levelName)} (${bs.mode==='read'?'reading':'spelling'})</h2>
      <p class="counter" style="margin-top:0">${bs.mode==='spell'?'Words she built right first time are ticked already. ':''}Tick each word and add a note if helpful (for example: said "d" for "t", needed help to blend).</p>
      <div class="tablewrap"><table class="sheet"><thead><tr><th>Word</th><th>Correct</th><th>Notes</th></tr></thead><tbody>
      ${bs.words.map((w,i)=>`<tr><td class="g">${esc(tokWord(toks(w[0])))}</td><td style="white-space:nowrap">${tog(i,true)} ${tog(i,false)}</td><td><input class="bnote" data-bnote="${i}" value="${esc(bs.notes[i]||'')}" aria-label="Notes for ${esc(tokWord(toks(w[0])))}" style="width:100%;font:inherit;border:2px solid var(--line);border-radius:8px;padding:6px 8px"></td></tr>`).join('')}
      </tbody></table></div>
      <label class="field" for="boverall" style="margin-top:12px">Overall notes<textarea id="boverall" style="font-family:var(--phonics);font-size:1rem;min-height:90px">${esc(bs.overall)}</textarea></label>
      <div class="row" style="margin-top:12px"><button class="btn good big" data-act="bsave">Save review</button><button class="btn alt" data-act="bendback">◀ Back</button></div></div>`;
    return;
  }
  const w=bs.words[bs.i]; const ts=toks(w[0]); const word=tokWord(ts);
  const last=bs.i===n-1;
  const navRow=`<div class="row center" style="margin-top:12px"><button class="mini" data-act="bprev" ${bs.i===0?'disabled':''}>◀ Back</button><button class="mini" data-act="bnext">${last?'Finish ▶':'Skip ▶'}</button></div>`;
  const bar=`<div class="progressbar"><i style="width:${Math.round(bs.i/n*100)}%"></i></div>`;
  if(bs.mode==='read'){
    const done=bs.revealed;
    h+=bar+`<div class="wordstage"><div class="counter">Word ${bs.i+1} of ${n}</div>
      <div class="sbrow">${soundButtonsHTML(ts)}</div>
      <div class="reveal">${done?`<div class="cheer">${picHTML(w[1])}</div><span class="w">${esc(word)}</span>${state.settings.spanish?`<span class="es">${esc(w[2])}</span>`:''}`:'<span class="counter">Say each sound, then blend them into the word</span>'}</div>
      <div class="row center">
        ${done?`<button class="btn alt" data-act="say" data-arg="${esc(word)}">🔊 Hear it</button><button class="btn big good" data-act="bnext">${last?'Finish ✓':'Next ▶'}</button>`
        :`<button class="btn coral big" data-act="blend">Blend it! ✨</button>`}
      </div>${navRow}</div>`;
  } else {
    if(!bs.spell||bs.spell.word!==word){
      const L=currentLevel();
      const pool=[...new Set(L.words.flatMap(x=>toks(x[0]).filter(t=>!t.includes('*'))))].filter(g=>!ts.includes(g));
      bs.spell={word,ts,slots:[],tiles:shuffle([...new Set(ts)].concat(shuffle(pool).slice(0,3))),checked:false,wrong:false};
    }
    const sp=bs.spell;
    h+=bar+`<div class="wordstage"><div class="counter">Word ${bs.i+1} of ${n}</div>
      <div class="reveal" style="min-height:110px">${picHTML(w[1])}${sp.checked&&sp.ok?`<span class="w">${esc(word)}</span>`:''}</div>
      <div class="row center"><button class="btn" data-act="say" data-arg="${esc(word)}">🔊 Hear the word</button>${state.settings.spanish?`<span class="es">${esc(w[2])}</span>`:''}</div>
      <div class="slots">${ts.map((t,i)=>{const v=sp.slots[i];let c=v?'filled':'';if(sp.checked&&v)c+=(v===t?' right':' wrong');return `<div class="slot ${c}">${v?esc(v):''}</div>`;}).join('')}</div>
      <div class="tiles">${sp.tiles.map(t=>`<button class="tile sound" data-act="stile" data-arg="${esc(t)}" ${sp.slots.length>=ts.length?'disabled':''}>${esc(t)}</button>`).join('')}</div>
      <div class="feedback ${sp.checked?(sp.ok?'ok':'no'):''}">${sp.checked?(sp.ok?pick(CHEERS):pick(TRYS)):''}</div>
      <div class="row center">
        <button class="btn alt" data-act="sundo" ${!sp.slots.length?'disabled':''}>⌫ Undo</button>
        <button class="btn alt" data-act="sclear">Clear</button>
        ${sp.checked&&sp.ok?`<button class="btn good big" data-act="bnext">${last?'Finish ✓':'Next ▶'}</button>`:''}
      </div>${navRow}</div>`;
  }
  app.innerHTML=h;
}

/* ---------------- VOCABULARY ---------------- */
function topicStars(t){let s=0;t.words.forEach(w=>{if((state.stars[starKey(t.id,w)]||0)>=3)s++;});return s;}
function renderVocab(){
  if(ui.editing){renderEditor();return;}
  const t=ui.topic?topicById(ui.topic):null;
  if(t&&t.nelson)t.icon=t.icon;
  if(!t){
    let h=`<div class="pagehead"><div><h1>Vocabulary</h1><p>Pick a topic. Each word has a picture, the English word and the Spanish meaning. Three stars ★★★ means she knows it.</p></div>
      <label class="row" style="gap:8px"><input type="checkbox" id="showes" data-act="toggles" ${state.settings.spanish?'checked':''}> Show Spanish</label></div>
      <div class="tgrid">`;
    const tile=tp=>`<button class="topic ${tp.custom?'custom':''} ${tp.nelson?'nelson':''}" data-act="topic" data-arg="${esc(tp.id)}"><span class="ic">${esc(tp.icon)}</span><b>${esc(tp.name)}</b><span class="es">${esc(tp.es)}</span><span class="meta">${tp.words.length} words${tp.nelson?` · 🔑 ${tp.words.filter(w=>w.key).length}`:''} · ${topicStars(tp)} learned</span></button>`;
    TOPICS.forEach(tp=>h+=tile(tp));
    h+=`</div><div class="setlabel" style="margin-top:28px"><h2>Nelson Spelling Pupil Book 1A</h2><span class="chip">key words and tricky words</span></div><div class="tgrid">`;
    NELSON.forEach(tp=>h+=tile(tp));
    h+=`</div><div class="setlabel" style="margin-top:28px"><h2>My own lists</h2></div><div class="tgrid">`;
    customTopics().forEach(tp=>h+=tile(tp));
    h+=`<button class="topic add" data-act="newlist"><span class="ic">＋</span><b>Make my own list</b><span class="meta">For anything from class</span></button></div>`;
    app.innerHTML=h;return;
  }
  const modes=[['learn','Picture dictionary'],['flash','Flashcards'],['listen','Listen and find'],['read','Read and find'],['spell','Spell it'],['pairs','Pairs game']];
  let h=`<div class="pagehead"><div><button class="mini" data-act="topics">◀ All topics</button>
     <h1 style="margin-top:8px">${t.nelson?'':t.icon+' '}${esc(t.name)} <span class="es" style="font-size:1.1rem">${esc(t.es)}</span></h1></div>
     ${t.custom?`<button class="btn alt" data-act="editlist" data-arg="${esc(t.id)}">✎ Edit list</button>`:''}
     ${t.nelson?`<label class="row" style="gap:8px;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:12px"><input type="checkbox" id="keyonly" ${ui.keyOnly?'checked':''}> 🔑 Key words only</label>`:''}</div>
     <div class="seg" role="group" aria-label="Vocabulary activity" style="margin-bottom:16px">${modes.map(([m,l])=>`<button class="${ui.vmode===m?'on':''}" data-act="vmode" data-arg="${m}">${l}</button>`).join('')}</div>`;
  if(!t.words.length){app.innerHTML=h+`<p class="empty">This list has no words yet. Use ✎ Edit list to add some.</p>`;return;}
  if(ui.vmode==='learn') h+=learnHTML(t);
  else if(ui.vmode==='flash') h+=flashHTML(t);
  else if(ui.vmode==='listen'||ui.vmode==='read') h+=quizHTML(t);
  else if(ui.vmode==='spell') h+=lspellHTML(t);
  else h+=pairsHTML(t);
  app.innerHTML=h;
}
function learnHTML(t){
  return `<div class="vgrid">${t.words.map((w,i)=>{const n=state.stars[starKey(t.id,w)]||0;
    return `<div class="vcard ${w.key?'key':''}"><div class="row center" style="gap:4px;min-height:${t.nelson?'1.4em':'0'}">${w.key?'<span class="keyw" title="Key word">🔑 key word</span>':''}${w.tricky?'<span class="tricky">tricky word</span>':''}</div>${picHTML(w.pic)}<span class="en">${esc(w.en)}</span>${state.settings.spanish?`<span class="es">${esc(w.es)}</span>`:''}
      <button class="stars" data-act="star" data-arg="${i}" title="Tap to change: ${n} of 3 stars" style="border:0;background:transparent;font-size:1.1rem;padding:0 4px">${stars(n)}</button>
      <div class="row center"><button class="mini" data-act="say" data-arg="${esc(w.en)}" aria-label="Say in English">🔊 Listen</button><button class="mini" data-act="star" data-arg="${i}" aria-label="Add a star (0 to 3)">⭐ +1</button></div></div>`;}).join('')}</div>`;
}
function flashHTML(t){
  if(!ui.flash||ui.flash.tid!==t.id) ui.flash={tid:t.id,order:shuffle([...t.words.keys()]),i:0,show:false};
  const f=ui.flash; const w=t.words[f.order[f.i%f.order.length]];
  const toEn=ui.flashDir!=='es';
  const dir=`<div class="seg" role="group" aria-label="Flashcard direction" style="margin-bottom:12px"><button class="${toEn?'on':''}" data-act="fdir" data-arg="en">Spanish → English</button><button class="${!toEn?'on':''}" data-act="fdir" data-arg="es">English → Spanish</button></div>`;
  const shown = toEn ? `<div class="es" style="font-size:1.8rem">${esc(w.es)}</div>` : `<div class="en">${esc(w.en)}</div><div class="row center"><button class="mini" data-act="say" data-arg="${esc(w.en)}">🔊 Listen</button></div>`;
  const answer = toEn ? `<div class="en">${f.show?esc(w.en):''}</div>` : `<div class="es" style="font-size:1.8rem;min-height:1.4em">${f.show?esc(w.es):''}</div>`;
  const ask = toEn ? 'What is it in English? ¿Cómo se dice en inglés?' : 'What is it in Spanish? ¿Cómo se dice en español?';
  return `<div style="text-align:center">${dir}</div><div class="flashcard"><div class="counter">${f.i%f.order.length+1} / ${f.order.length}${w.key?' · 🔑':''}</div>
    ${picHTML(w.pic)}
    ${shown}
    ${answer}
    <p class="counter">${f.show?'Did she know it?':ask}</p>
    <div class="row center">${f.show?`<button class="btn alt" data-act="say" data-arg="${esc(w.en)}">🔊 Hear it</button><button class="btn bad" data-act="fans" data-arg="0">✗ Not yet</button><button class="btn good" data-act="fans" data-arg="1">✓ Knew it</button>`
      :`<button class="btn big coral" data-act="fshow">${toEn?'Show the English word':'Show the Spanish word'}</button>`}</div></div>`;
}
function addStar(t,w,delta){const k=starKey(t.id,w);state.stars[k]=Math.max(0,Math.min(3,(state.stars[k]||0)+delta));save();}

function distractors(t,w,n){
  let pool=t.words.filter(x=>x.en!==w.en&&x.pic!==w.pic);
  if(pool.length<n){const extra=TOPICS.flatMap(tp=>tp.words).filter(x=>x.en!==w.en&&x.pic!==w.pic&&!pool.some(p=>p.en===x.en||p.pic===x.pic));pool=pool.concat(shuffle(extra).slice(0,n-pool.length));}
  const out=[];for(const x of shuffle(pool)){if(out.length>=n)break;if(!out.some(o=>o.pic===x.pic||o.en===x.en))out.push(x);}
  return out;
}
function quizHTML(t){
  const mode=ui.vmode;
  if(!ui.quiz||ui.quiz.tid!==t.id||ui.quiz.mode!==mode){
    const qs=shuffle(t.words).slice(0,Math.min(8,t.words.length)).map(w=>({w,opts:shuffle([w].concat(distractors(t,w,3)))}));
    ui.quiz={tid:t.id,mode,qs,i:0,score:0,answered:null};
    if(mode==='listen') setTimeout(()=>speak(qs[0].w.en),300);
  }
  const q=ui.quiz;
  if(q.i>=q.qs.length){
    return `<div class="qwrap cheer"><h2>Finished! ¡Terminado!</h2><p class="qprompt">${q.score} / ${q.qs.length}</p><p>${q.score===q.qs.length?'Perfect! 🌟':'Every right answer adds a star to that word.'}</p>
      <div class="row center"><button class="btn" data-act="qagain">Play again</button></div></div>`;
  }
  const cur=q.qs[q.i]; const allPics=cur.opts.every(o=>o.pic);
  const face=o=> (allPics ? picHTML(o.pic) : '') + (allPics&&q.answered!=null ? `<span class="lbl" style="font-size:1rem">${esc(o.en)}</span>` : '') + (!allPics ? `<span class="lbl">${esc(mode==='listen'?o.en:o.es)}</span>`:'');
  const prompt = mode==='listen'
    ? `<p class="counter">Listen and tap the right one. Escucha y toca.</p><button class="btn big" data-act="say" data-arg="${esc(cur.w.en)}">🔊 Listen again</button>`
    : `<p class="counter">Read the word and tap the picture. Lee y toca.</p><div class="qprompt">${esc(cur.w.en)}</div>`;
  return `<div class="progressbar"><i style="width:${Math.round(q.i/q.qs.length*100)}%"></i></div>
   <div class="qwrap"><div class="counter">${q.i+1} / ${q.qs.length}</div>${prompt}
   <div class="qgrid">${cur.opts.map((o,i)=>{let c='';if(q.answered!=null){if(o.en===cur.w.en)c='right';else if(i===q.answered)c='wrong';}
     return `<button class="qopt ${c}" data-act="qans" data-arg="${i}" ${q.answered!=null?'disabled':''}>${face(o)}</button>`;}).join('')}</div>
   <div class="feedback ${q.answered!=null?(cur.opts[q.answered].en===cur.w.en?'ok':'no'):''}">${q.answered!=null?(cur.opts[q.answered].en===cur.w.en?pick(CHEERS):`It's "${esc(cur.w.en)}" (${esc(cur.w.es)})`):''}</div>
   ${q.answered!=null?'<div class="row center"><button class="btn big" data-act="qnext">Next ▶</button></div>':''}</div>`;
}
function spellable(t){return t.words.filter(w=>/^[A-Za-z]{2,10}$/.test(w.en));}
function lspellHTML(t){
  const list=spellable(t);
  if(!list.length) return `<p class="empty">No single words to spell in this topic. Try another activity.</p>`;
  if(!ui.lspell||ui.lspell.tid!==t.id){ui.lspell={tid:t.id,order:shuffle([...list.keys()]),i:0};newLetters(list);}
  const s=ui.lspell; const w=list[s.order[s.i%s.order.length]];
  if(!s.tiles) newLetters(list);
  const target=w.en.toLowerCase();
  return `<div class="qwrap"><div class="counter">${s.i%s.order.length+1} / ${s.order.length}</div>
    <div class="reveal" style="min-height:110px">${picHTML(w.pic)}${state.settings.spanish?`<span class="es">${esc(w.es)}</span>`:''}</div>
    <div class="row center"><button class="btn" data-act="say" data-arg="${esc(w.en)}">🔊 Hear the word</button><button class="mini" data-act="lhint">💡 First letter</button></div>
    <div class="slots">${[...target].map((ch,i)=>{const v=s.slots[i];let c=v!=null?'filled':'';if(s.checked&&v!=null)c+=(s.tiles[v]===ch?' right':' wrong');return `<div class="slot ${c}" style="min-width:56px;height:70px;font-size:2.2rem">${v!=null?esc(s.tiles[v]):''}</div>`;}).join('')}</div>
    <div class="tiles">${s.tiles.map((ch,i)=>`<button class="tile" data-act="ltile" data-arg="${i}" ${s.slots.includes(i)||s.slots.length>=target.length?'disabled':''}>${esc(ch)}</button>`).join('')}</div>
    <div class="feedback ${s.checked?(s.ok?'ok':'no'):''}">${s.checked?(s.ok?pick(CHEERS):pick(TRYS)):''}</div>
    <div class="row center"><button class="btn alt" data-act="lundo" ${!s.slots.length?'disabled':''}>⌫ Undo</button><button class="btn alt" data-act="lclear">Clear</button>${s.checked&&s.ok?'<button class="btn good" data-act="lnext">Next ▶</button>':''}<button class="mini" data-act="lnext">Skip ▶</button></div></div>`;
}
function newLetters(list){
  const s=ui.lspell; const w=list[s.order[s.i%s.order.length]]; const target=w.en.toLowerCase();
  const extra=shuffle([...'abcdefghijklmnoprstuw'].filter(c=>!target.includes(c))).slice(0,2);
  s.tiles=shuffle([...target].concat(extra)); s.slots=[]; s.checked=false; s.ok=false;
}
function pairsHTML(t){
  if(!ui.pairs||ui.pairs.tid!==t.id){
    const chosen=[];for(const w of shuffle(t.words.filter(x=>x.pic))){if(chosen.length>=6)break;if(!chosen.some(c=>c.pic===w.pic||c.en===w.en))chosen.push(w);}
    const cards=shuffle(chosen.flatMap((w,i)=>[{k:i,type:'pic',w},{k:i,type:'word',w}]));
    ui.pairs={tid:t.id,cards,open:[],done:[],tries:0};
  }
  const p=ui.pairs;
  if(p.cards.length<4) return `<p class="empty">This list doesn't have enough pictures for the pairs game. Try another activity.</p>`;
  if(p.done.length===p.cards.length){
    return `<div class="qwrap cheer"><h2>All pairs found! ¡Muy bien!</h2><p>${p.tries} tries</p><div class="row center"><button class="btn" data-act="pagain">Play again</button></div></div>`;
  }
  return `<p class="counter" style="text-align:center">Find the picture and its word. Busca las parejas.</p>
    <div class="mgrid">${p.cards.map((c,i)=>{const isOpen=p.open.includes(i)||p.done.includes(i);
      const inner= !isOpen ? '?' : (c.type==='pic'?picHTML(c.w.pic):`<span class="lbl">${esc(c.w.en)}</span>`);
      return `<button class="mcard ${p.done.includes(i)?'done':isOpen?'open':''}" data-act="pcard" data-arg="${i}" aria-label="card ${i+1}">${inner}</button>`;}).join('')}</div>`;
}

/* custom list editor */

       <label class="field">English word<input id="wen" placeholder="cat" value="${esc(ew.en||'')}"></label>

function fileToThumb(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=240,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

function newDraft(phase){return {id:'a'+Date.now(),phase,date:new Date().toISOString(),sec:'graphemes',i:0,
  g:{},b:{},s:{},t:{},obs:''};}
function today(iso){try{return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return iso.slice(0,10);}}
function scoreOf(a){
  const d=ASSESS[a.phase];const gi=aItems(a.phase,'graphemes');
  const cnt=(obj,keys,f)=>keys.filter(k=>obj[k]&&f(obj[k])).length;
  return {
    rec:cnt(a.g,gi,v=>v.r===true), wri:cnt(a.g,gi,v=>v.w===true), gTotal:gi.length,
    blend:cnt(a.b,aItems(a.phase,'blending'),v=>v.ok===true), bTotal:d.blending.length,
    seg:cnt(a.s,d.segmenting,v=>v.ok===true), sTotal:d.segmenting.length,
    tricky:cnt(a.t,d.tricky,v=>v.ok===true), tTotal:d.tricky.length };
}
function scoreLine(a){const s=scoreOf(a);return `Recognise ${s.rec}/${s.gTotal} · Write ${s.wri}/${s.gTotal} · Blending ${s.blend}/${s.bTotal} · Segmenting ${s.seg}/${s.sTotal} · Tricky ${s.tricky}/${s.tTotal}`;}
function chipState(a,sec,key){
  if(sec==='graphemes'){const v=a.g[key];if(!v||v.r==null)return'';return v.r?'ok':'no';}
  const o=a[{blending:'b',segmenting:'s',tricky:'t'}[sec]][key];if(!o||o.ok==null)return'';return o.ok?'ok':'no';}

function niceErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'The email or password is not right.';
  if(/email-already-in-use/.test(c))return 'There is already an account with this email. Log in instead.';
  if(/weak-password/.test(c))return 'The password needs at least 6 characters.';
  if(/operation-not-allowed|admin-restricted/.test(c))return 'Creating accounts is switched off for this app.';
  if(/missing-email/.test(c))return 'Type your email first.';
  if(/too-many-requests/.test(c))return 'Too many tries. Wait a few minutes and try again.';
  if(/network-request-failed|unavailable/.test(c))return 'No internet connection. Changes stay on this computer for now.';
  if(/permission-denied/.test(c))return 'Firebase refused access. Check the security rules in README step 4.';
  return (e&&e.message)||'Something went wrong.';
}

/* preferCloud: right after logging in, her saved progress replaces anything done on this computer while logged out */
async function cloudLoad(preferCloud){
  if(!fb.user||fb.busy)return;
  fb.busy=true;setCloudStatus('Loading her progress…');
  try{
    const snap=await docRef().get();
    if(snap.exists){
      const d=JSON.parse(snap.data().json);
      const remoteT=d.updatedAt||0, localT=state.updatedAt||0;
      if(preferCloud||remoteT>localT){if(remoteT!==localT||preferCloud){importData(d);render();}}
      else if(localT>remoteT){fb.busy=false;await cloudSave();return;}
    } else {fb.busy=false;await cloudSave();return;}
    setCloudStatus('Up to date. Saved in her account.');
  }catch(e){setCloudStatus(niceErr(e));}
  fb.busy=false;
}
async function cloudSave(){
  if(!fb.user)return;
  if(fb.busy){scheduleSync();return;}
  fb.busy=true;setCloudStatus('Saving…');
  try{
    await docRef().set({json:JSON.stringify(exportData()),updatedAt:state.updatedAt||Date.now(),savedAt:firebase.firestore.FieldValue.serverTimestamp()});
    fb.pending=false;setCloudStatus('Saved in her account at '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){setCloudStatus(niceErr(e));}
  fb.busy=false;
}
function scheduleSync(){
  if(!fb.user)return;
  fb.pending=true;clearTimeout(fb.timer);fb.timer=setTimeout(cloudSave,3000);
}
document.addEventListener('visibilitychange',()=>{
  if(!fb.user)return;
  if(document.visibilityState==='hidden'&&fb.pending){clearTimeout(fb.timer);cloudSave();}
  if(document.visibilityState==='visible'&&!fb.pending)cloudLoad(false);
});

function downloadBackup(){
  const txt=JSON.stringify(exportData(),null,1);
  const name='sounds-and-words-backup-'+new Date().toISOString().slice(0,10)+'.json';
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast('Backup downloaded');}
  catch(e){toast('Download is blocked here. Use "Copy backup text" instead.');}
}

    try{await navigator.clipboard.writeText(assessText(a));toast('Copied. Paste it into an email or document.');}catch(e){toast('Copying is blocked here. Select the tables and copy them instead.');}},

  cycsound:a=>{const cur=state.sounds[a];if(!cur)state.sounds[a]='known';else if(cur==='known')state.sounds[a]='practise';else delete state.sounds[a];save();renderProgress();},
  savesettings:()=>{const sn=document.getElementById('sname');if(sn)state.settings.name=sn.value.trim();state.settings.rate=parseFloat(document.getElementById('srate').value)||0.85;save();toast('Settings saved');renderProgress();},
  testvoice:()=>speak('Hello! Let\'s read together.','en'),
  reset:()=>{ui.confirm='reset';renderProgress();},
  resetyes:()=>{state.sounds={};state.stars={};state.blends={};state.blendSessions=[];ui.confirm=null;save();toast('Progress cleared');renderProgress();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(e.target.id==='overlay')closeModal(); return; }
  if(el.tagName==='INPUT'&&el.type==='checkbox'){return;}
  const fn=A[el.dataset.act]; if(fn){fn(el.dataset.arg,el);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='bkfile'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(d.app!=='sounds-and-words')throw new Error();ui.pendingImport=d;ui.confirm='restore';renderProgress();}catch(e){toast('That file is not a Sounds and Words backup');}};fr.readAsText(el.files[0]);return;}
  if(el.id==='keyonly'){ui.keyOnly=el.checked;ui.quiz=ui.flash=ui.pairs=ui.lspell=null;ui.bs=null;render();return;}
  if(el.id==='nunit'){ui.nelsonUnit=el.value;ui.bs=null;renderBlending();return;} if(el.matches('input[type=checkbox][data-act]')){const fn=A[el.dataset.act];fn&&fn(el.dataset.arg,el);}
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.bnote!=null&&ui.bs){ui.bs.notes[e.target.dataset.bnote]=e.target.value;return;}if(e.target.id==='boverall'&&ui.bs){ui.bs.overall=e.target.value;return;}if(e.target.id==='asaid'&&state.draft){const d=state.draft;const key=aItems(d.phase,d.sec)[d.i];const o=d[e.target.dataset.k];o[key]=o[key]||{};o[key].said=e.target.value;save();return;}if(e.target.id==='aobs'&&state.draft){state.draft.obs=e.target.value;save();return;}if(e.target.id==='srate'){const v=document.getElementById('ratev');if(v)v.textContent=parseFloat(e.target.value).toFixed(2);}});

readHash(); render(); initCloud();
</script>
</body>
